# DynamiCog Lab members. Edit this file to update the People page.
# Add a headshot to assets/img/people/<image> and reference it below (optional).

director:
  name: Nick Duran
  role: Lab Director
  image: prof_pic.jpg
  # People-page photo (separate from the home-page prof_pic.jpg). Drop it in
  # assets/img/people/ and set the filename here; empty shows a placeholder.
  people_image:
  # CV link under the name on the People page. Put the PDF in assets/pdf/ and set
  # the filename here (e.g. cv: duran_cv.pdf). Empty = placeholder link (#).
  cv:
  bio: >
    Associate Professor in the Department of Psychology, College of Liberal Arts,
    at The University of Texas at Austin. Ph.D. in Cognitive Psychology from the
    University of Memphis (NSF Graduate Research Fellow); NSF Postdoctoral Research
    Fellow at the University of California, Merced (Cognitive and Information Sciences).
  # Research interests (one sentence-style list), People page only.
  interests:
    - Communication dynamics and behavioral data science
    - cognition as embodied and extended into the larger environment
    - covariation of action and mind in decision tasks and belief expression
    - language and discourse analysis
  links:
    email: nicholas.duran@utexas.edu
    scholar: https://scholar.google.com/citations?user=dU26pfIAAAAJ
    github: https://github.com/nickduran

